<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>harness</title>
<link rel="stylesheet" href="harness.css">
<style>
  html, body { margin: 0; height: 100%; background: #0b0806; overflow: hidden; touch-action: none; user-select: none; }
  #stage { position: fixed; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; transform-origin: 0 0; --sw: 100vw; --sh: 100vh; --sa-t: 0px; --sa-r: 0px; --sa-b: 0px; --sa-l: 0px; }
  #stage.rot { transform: rotate(90deg) translateY(-100%); }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hs-loading { display: none; }
</style>
</head>
<body>
<div id="stage">
<canvas id="game" tabindex="0"></canvas>
<div id="ui"></div>
<div id="hs-loading" class="hidden"><div class="bar"><i></i></div></div>
<div id="hs-fatal" class="hidden"></div>
</div>
<script type="module" src="harness.js"></script>
</body>
</html>
