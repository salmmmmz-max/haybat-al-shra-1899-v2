<style>
  html, body { margin: 0; height: 100%; background: #0b0806; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-text-size-adjust: 100%; }
  body { position: fixed; inset: 0; }
  #stage { position: fixed; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; transform-origin: 0 0; background: #0b0806;
    --sw: 100vw; --sh: 100vh;
    --sa-t: env(safe-area-inset-top, 0px); --sa-r: env(safe-area-inset-right, 0px); --sa-b: env(safe-area-inset-bottom, 0px); --sa-l: env(safe-area-inset-left, 0px); }
  /* portrait on a touch device: the stage is laid out as landscape and turned 90° — hold the phone sideways */
  #stage.rot { transform: rotate(90deg) translateY(-100%);
    --sa-l: env(safe-area-inset-top, 0px); --sa-t: env(safe-area-inset-right, 0px); --sa-r: env(safe-area-inset-bottom, 0px); --sa-b: env(safe-area-inset-left, 0px); }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #hs-loading { position: absolute; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 18px; background: radial-gradient(120% 90% at 50% 30%, #3a2414 0%, #150d08 60%, #0b0806 100%); color: #f3e6cf; font-family: 'Aref Ruqaa', 'Tajawal', serif; text-align: center; transition: opacity .5s ease; }
  #hs-loading.hidden { opacity: 0; pointer-events: none; }
  #hs-loading h1 { margin: 0; font-size: clamp(2.6rem, 9vmax, 5rem); font-weight: 700; text-shadow: 0 3px 22px #000; }
  #hs-loading p { margin: 0; font-family: 'Tajawal', system-ui, sans-serif; opacity: .8; }
  #hs-loading .bar { width: min(64%, 320px); height: 6px; border-radius: 9px; background: #ffffff22; overflow: hidden; }
  #hs-loading .bar > i { display: block; height: 100%; background: #e9b44c; transform-origin: right center; transform: scaleX(.02); transition: transform .25s ease; }
  #hs-fatal { position: absolute; inset: 0; z-index: 200; display: grid; place-content: center; padding: 2rem; text-align: center; background: #0b0806; color: #f3e6cf; font: 1.1rem/1.8 'Tajawal', system-ui, sans-serif; }
  #hs-fatal.hidden { display: none; }
</style>

<div id="stage">

<div id="hs-loading"><h1>هيبة الصحراء</h1><p>الربع الخالي — ١٨٩٩م</p><div class="bar"><i></i></div></div>
<div id="hs-fatal" class="hidden"></div>
</div>
<noscript><div id="hs-fatal">هذه اللعبة تحتاج إلى تفعيل JavaScript.</div></noscript>
<script>
  // iOS: stop pinch/double-tap zoom and rubber-banding
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (n) { document.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false }); });
  // block page panning on the play surface only; scrollable panels and form controls (settings sliders) keep their own touch behaviour
  document.addEventListener('touchmove', function (e) {
    var t = e.target;
    if (t && t.closest && t.closest('.panel .body, input, select, textarea')) return;
    e.preventDefault();
  }, { passive: false });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });
</script>
